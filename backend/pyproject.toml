[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools"

[project]
name = "todo-backend"
version = "1.0.0"
description = "Todo Backend Application"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "better-auth>=0.0.1b11",
    "alembic>=1.10.0",
    "psycopg2-binary>=2.9.5",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pytest>=7.0",
    "httpx>=0.24.0",
    "slowapi>=0.1.9",
    "openai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]